
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wilderness</title>

<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #87b9df;
}
#game {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
</style>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>

<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const engine = new BABYLON.Engine(canvas, true);

function hill(x, z, cx, cz, height, width) {
  const dx = (x - cx) / width;
  const dz = (z - cz) / width;
  return height * Math.exp(-(dx * dx + dz * dz) * 0.5);
}

// RASHAYA-INSPIRED TERRAIN
function terrainHeight(x, z) {
  let h = 0;

  // Gentle natural rolling ground
  h += 1.8 * Math.sin(x * 0.025) * Math.cos(z * 0.025);
  h += 1.2 * Math.sin((x + z) * 0.035);

  // Broad Lebanese hills
  h += hill(x, z, -85, -35, 17, 38);
  h += hill(x, z, -45, 65, 14, 42);
  h += hill(x, z, 60, 75, 21, 45);
  h += hill(x, z, 85, -35, 17, 38);
  h += hill(x, z, -75, 105, 13, 40);
  h += hill(x, z, 55, -105, 15, 42);

  // A lower valley through the middle
  h -= hill(x, z, 0, 5, 3.5, 45);

  return h;
}

const createScene = function () {
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.53, 0.73, 0.87, 1);

  // LIGHTING
  const light = new BABYLON.HemisphericLight(
    "light",
    new BABYLON.Vector3(0, 1, 0),
    scene
  );
  light.intensity = 0.95;

  const sun = new BABYLON.DirectionalLight(
    "sun",
    new BABYLON.Vector3(-0.5, -1, 0.4),
    scene
  );
  sun.intensity = 0.55;

  // CREATE TERRAIN
  const ground = BABYLON.MeshBuilder.CreateGround(
    "ground",
    {
      width: 300,
      height: 300,
      subdivisions: 150
    },
    scene
  );

  const positions = ground.getVerticesData(
    BABYLON.VertexBuffer.PositionKind
  );

  for (let i = 0; i < positions.length; i += 3) {
    const x = positions[i];
    const z = positions[i + 2];

    positions[i + 1] = terrainHeight(x, z);
  }

  ground.updateVerticesData(
    BABYLON.VertexBuffer.PositionKind,
    positions
  );

  const indices = ground.getIndices();
  const normals = [];

  BABYLON.VertexData.ComputeNormals(
    positions,
    indices,
    normals
  );

  ground.updateVerticesData(
    BABYLON.VertexBuffer.NormalKind,
    normals
  );

  ground.refreshBoundingInfo();

  // GROUND TEXTURE
  const groundMat = new BABYLON.StandardMaterial(
    "groundMat",
    scene
  );

  groundMat.diffuseColor = new BABYLON.Color3(1, 1, 1);
  groundMat.specularColor = new BABYLON.Color3(0.04, 0.04, 0.04);

  const groundTexture = new BABYLON.Texture(
    "forrest_ground_01_diff_1k.jpg",
    scene,
    false,
    false,
    BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
    function () {
      groundTexture.uScale = 12;
      groundTexture.vScale = 12;
      groundMat.diffuseTexture = groundTexture;
    },
    function (message, exception) {
      console.error("Texture loading error:", message, exception);
    }
  );

  ground.material = groundMat;

  // TERRAIN COLLISIONS
  scene.collisionsEnabled = true;
  ground.checkCollisions = true;

  // DISTANT MOUNTAINS
  const mountainMat = new BABYLON.StandardMaterial(
    "mountainMat",
    scene
  );

  mountainMat.diffuseColor = new BABYLON.Color3(
    0.39, 0.40, 0.38
  );

  for (let i = 0; i < 18; i++) {
    const angle = (i / 18) * Math.PI * 2;
    const distance = 170;

    const mountain = BABYLON.MeshBuilder.CreateSphere(
      "mountain",
      { diameter: 1, segments: 6 },
      scene
    );

    const size = 25 + Math.random() * 25;

    mountain.scaling.set(
      size,
      size * 1.7,
      size * 0.8
    );

    mountain.position.set(
      Math.cos(angle) * distance,
      size * 0.8,
      Math.sin(angle) * distance
    );

    mountain.material = mountainMat;
  }

  // ROCKS
  const rockMat = new BABYLON.StandardMaterial(
    "rockMat",
    scene
  );

  rockMat.diffuseColor = new BABYLON.Color3(
    0.42, 0.41, 0.37
  );

  for (let i = 0; i < 28; i++) {
    const rock = BABYLON.MeshBuilder.CreateSphere(
      "rock",
      { diameter: 1, segments: 5 },
      scene
    );

    const size = 1 + Math.random() * 3;
    const x = Math.random() * 180 - 90;
    const z = Math.random() * 180 - 90;

    rock.scaling.set(size, size * 0.6, size);

    rock.position.set(
      x,
      terrainHeight(x, z) + size * 0.25,
      z
    );

    rock.material = rockMat;
  }

  // FIRST-PERSON CAMERA
  const startX = 0;
  const startZ = -30;

  const camera = new BABYLON.UniversalCamera(
    "camera",
    new BABYLON.Vector3(
      startX,
      terrainHeight(startX, startZ) + 2.5,
      startZ
    ),
    scene
  );

  camera.attachControl(canvas, true);
  camera.speed = 0.35;
  camera.angularSensibility = 4000;

  camera.keysUp.push(87);
  camera.keysDown.push(83);
  camera.keysLeft.push(65);
  camera.keysRight.push(68);

  camera.minZ = 0.1;
  camera.checkCollisions = true;
  camera.applyGravity = true;
  camera.ellipsoid = new BABYLON.Vector3(0.5, 1, 0.5);

  scene.gravity = new BABYLON.Vector3(0, -0.15, 0);

  // DISTANCE FOG
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.002;
  scene.fogColor = new BABYLON.Color3(0.53, 0.73, 0.87);

  return scene;
};

const scene = createScene();

engine.runRenderLoop(function () {
  scene.render();
});

window.addEventListener("resize", function () {
  engine.resize();
});
</script>
</body>
</html>
