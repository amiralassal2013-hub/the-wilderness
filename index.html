
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wilderness</title>

<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #87b9df;
}
#game {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
</style>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>

<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const engine = new BABYLON.Engine(canvas, true);

function hill(x, z, cx, cz, height, widthX, widthZ) {
  const dx = (x - cx) / widthX;
  const dz = (z - cz) / widthZ;
  return height * Math.exp(-0.5 * (dx * dx + dz * dz));
}

// NATURAL LEBANESE-INSPIRED HILLS
function terrainHeight(x, z) {
  let h = 0;

  // Gentle uneven countryside
  h += 1.2 * Math.sin(x * 0.035) * Math.cos(z * 0.03);
  h += 0.8 * Math.sin((x + z) * 0.045);

  // Large, rounded hills
  h += hill(x, z, -95, -65, 24, 55, 48);
  h += hill(x, z, -45, 55, 19, 58, 52);
  h += hill(x, z, 65, 65, 28, 62, 55);
  h += hill(x, z, 95, -45, 23, 55, 60);
  h += hill(x, z, -90, 115, 18, 48, 55);
  h += hill(x, z, 35, -115, 21, 55, 50);
  h += hill(x, z, 125, 110, 17, 48, 52);

  // Open valley in the middle
  h -= hill(x, z, 0, 0, 2, 55, 45);

  return h;
}

const createScene = function () {
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.53, 0.73, 0.87, 1);

  // HDRI ENVIRONMENT: Mossy Forest 2K
  // Use a modest cubemap size to keep loading and rendering reasonable
  // on older integrated graphics.
  try {
    const hdriTexture = new BABYLON.EXRCubeTexture(
      "./mossy_forest_2k.exr",
      scene,
      128,
      false,
      true,
      false,
      true
    );
    scene.environmentTexture = hdriTexture;

    // Show the same HDRI as the distant 360-degree sky.
    const hdriSkybox = BABYLON.MeshBuilder.CreateBox(
      "hdriSkybox",
      { size: 1000 },
      scene
    );
    const hdriSkyboxMaterial = new BABYLON.StandardMaterial(
      "hdriSkyboxMaterial",
      scene
    );
    hdriSkyboxMaterial.backFaceCulling = false;
    hdriSkyboxMaterial.disableLighting = true;
    hdriSkyboxMaterial.diffuseColor = BABYLON.Color3.Black();
    hdriSkyboxMaterial.specularColor = BABYLON.Color3.Black();
    hdriSkyboxMaterial.reflectionTexture = hdriTexture.clone();
    hdriSkyboxMaterial.reflectionTexture.coordinatesMode =
      BABYLON.Texture.SKYBOX_MODE;
    hdriSkyboxMaterial.disableDepthWrite = true;
    hdriSkybox.material = hdriSkyboxMaterial;
    hdriSkybox.infiniteDistance = true;
    hdriSkybox.isPickable = false;
  } catch (error) {
    console.error("Could not initialize the HDRI environment:", error);
  }

  // LIGHTING
  const light = new BABYLON.HemisphericLight(
    "light",
    new BABYLON.Vector3(0, 1, 0),
    scene
  );
  light.intensity = 0.95;

  const sun = new BABYLON.DirectionalLight(
    "sun",
    new BABYLON.Vector3(-0.5, -1, 0.4),
    scene
  );
  sun.intensity = 0.55;

  // CREATE UPDATABLE TERRAIN
  const ground = BABYLON.MeshBuilder.CreateGround(
    "ground",
    {
      width: 300,
      height: 300,
      subdivisions: 180,
      updatable: true
    },
    scene
  );

  const positions = ground.getVerticesData(
    BABYLON.VertexBuffer.PositionKind
  );

  for (let i = 0; i < positions.length; i += 3) {
    const x = positions[i];
    const z = positions[i + 2];

    positions[i + 1] = terrainHeight(x, z);
  }

  ground.updateVerticesData(
    BABYLON.VertexBuffer.PositionKind,
    positions,
    true
  );

  // RECALCULATE TERRAIN NORMALS
  const indices = ground.getIndices();
  const normals = [];

  BABYLON.VertexData.ComputeNormals(
    positions,
    indices,
    normals
  );

  ground.updateVerticesData(
    BABYLON.VertexBuffer.NormalKind,
    normals
  );

  ground.refreshBoundingInfo();

  // GROUND TEXTURE
  const groundMat = new BABYLON.StandardMaterial(
    "groundMat",
    scene
  );

  groundMat.diffuseColor = new BABYLON.Color3(1, 1, 1);
  groundMat.specularColor = new BABYLON.Color3(0.04, 0.04, 0.04);

  const groundTexture = new BABYLON.Texture(
    "forrest_ground_01_diff_1k.jpg",
    scene,
    false,
    false,
    BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
    function () {
      groundTexture.uScale = 12;
      groundTexture.vScale = 12;
      groundMat.diffuseTexture = groundTexture;
    },
    function (message, exception) {
      console.error("Texture loading error:", message, exception);
    }
  );

  ground.material = groundMat;

  // COLLISIONS
  scene.collisionsEnabled = true;
  ground.checkCollisions = true;

  // DISTANT MOUNTAINS
  const mountainMat = new BABYLON.StandardMaterial(
    "mountainMat",
    scene
  );
  mountainMat.diffuseColor = new BABYLON.Color3(0.39, 0.40, 0.38);

  for (let i = 0; i < 18; i++) {
    const angle = (i / 18) * Math.PI * 2;
    const distance = 170;

    const mountain = BABYLON.MeshBuilder.CreateSphere(
      "mountain",
      { diameter: 1, segments: 6 },
      scene
    );

    const size = 25 + Math.random() * 25;

    mountain.scaling.set(size, size * 1.7, size * 0.8);

    mountain.position.set(
      Math.cos(angle) * distance,
      size * 0.8,
      Math.sin(angle) * distance
    );

    mountain.material = mountainMat;
  }

  // ROCKS
  const rockMat = new BABYLON.StandardMaterial("rockMat", scene);
  rockMat.diffuseColor = new BABYLON.Color3(0.42, 0.41, 0.37);

  for (let i = 0; i < 28; i++) {
    const rock = BABYLON.MeshBuilder.CreateSphere(
      "rock",
      { diameter: 1, segments: 5 },
      scene
    );

    const size = 1 + Math.random() * 3;
    const x = Math.random() * 180 - 90;
    const z = Math.random() * 180 - 90;

    rock.scaling.set(size, size * 0.6, size);

    rock.position.set(
      x,
      terrainHeight(x, z) + size * 0.25,
      z
    );

    rock.material = rockMat;
  }

  // NATURAL-LOOKING LOW-POLY GRASS
  // Several curved-looking tapered blades per clump, using simple geometry.
  const grassMaterials = [];
  [
    new BABYLON.Color3(0.16, 0.29, 0.09),
    new BABYLON.Color3(0.22, 0.36, 0.11),
    new BABYLON.Color3(0.29, 0.40, 0.14),
    new BABYLON.Color3(0.12, 0.25, 0.08)
  ].forEach((color, i) => {
    const material = new BABYLON.StandardMaterial("grassTone" + i, scene);
    material.diffuseColor = color;
    material.specularColor = BABYLON.Color3.Black();
    grassMaterials.push(material);
  });

  const grassSources = [];
  for (let variant = 0; variant < grassMaterials.length; variant++) {
    const blades = [];
    for (let i = 0; i < 7; i++) {
      const height = 0.38 + Math.random() * 0.42;
      const width = 0.11 + Math.random() * 0.09;
      const blade = BABYLON.MeshBuilder.CreateCylinder("grassBlade", {
        height,
        diameterTop: 0.006,
        diameterBottom: width,
        tessellation: 3
      }, scene);
      blade.position.x = (Math.random() - 0.5) * 1.05;
      blade.position.z = (Math.random() - 0.5) * 1.05;
      blade.position.y = height / 2;
      blade.rotation.z = (Math.random() - 0.5) * 0.42;
      blade.rotation.x = (Math.random() - 0.5) * 0.42;
      blade.rotation.y = Math.random() * Math.PI;
      blades.push(blade);
    }
    const clump = BABYLON.Mesh.MergeMeshes(blades, true, true, undefined, false, true);
    clump.name = "grassClumpVariant" + variant;
    clump.material = grassMaterials[variant];
    clump.isPickable = false;
    grassSources.push(clump);
  }

  // Cover the entire 300 x 300 ground with a staggered grid.
  // Small random offsets keep the pattern from looking artificial.
  const grassRows = 145;
  const grassColumns = 145;
  const groundCoverage = 290;
  for (let row = 0; row < grassRows; row++) {
    for (let col = 0; col < grassColumns; col++) {
      const source = grassSources[Math.floor(Math.random() * grassSources.length)];
      const spacingX = groundCoverage / (grassColumns - 1);
      const spacingZ = groundCoverage / (grassRows - 1);
      const x = -groundCoverage / 2 + col * spacingX + (Math.random() - 0.5) * 1.8;
      const z = -groundCoverage / 2 + row * spacingZ + (Math.random() - 0.5) * 1.8;
      const scale = 1.15 + Math.random() * 0.65;
      const yaw = Math.random() * Math.PI * 2;
      const matrix = BABYLON.Matrix.Compose(
        new BABYLON.Vector3(scale, scale, scale),
        BABYLON.Quaternion.RotationYawPitchRoll(yaw, 0, 0),
        new BABYLON.Vector3(x, terrainHeight(x, z), z)
      );
      source.thinInstanceAdd(matrix);
    }
  }
  grassSources.forEach(mesh => mesh.freezeWorldMatrix());

  // TREE ASSETS REMOVED TEMPORARILY.
  // A full-sized replacement pine model will be added when uploaded.

  // FIRST-PERSON CAMERA
  const startX = 0;
  const startZ = -30;

  const camera = new BABYLON.UniversalCamera(
    "camera",
    new BABYLON.Vector3(
      startX,
      terrainHeight(startX, startZ) + 2.5,
      startZ
    ),
    scene
  );

  camera.attachControl(canvas, true);
  camera.speed = 0.35;
  camera.angularSensibility = 4000;

  camera.keysUp.push(87);
  camera.keysDown.push(83);
  camera.keysLeft.push(65);
  camera.keysRight.push(68);

  camera.minZ = 0.1;
  camera.checkCollisions = true;
  camera.applyGravity = true;
  camera.ellipsoid = new BABYLON.Vector3(0.5, 1, 0.5);

  scene.gravity = new BABYLON.Vector3(0, -0.15, 0);

  // DISTANCE FOG
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.002;
  scene.fogColor = new BABYLON.Color3(0.53, 0.73, 0.87);

  return scene;
};

const scene = createScene();

engine.runRenderLoop(function () {
  scene.render();
});

window.addEventListener("resize", function () {
  engine.resize();
});
</script>
</body>
</html>
